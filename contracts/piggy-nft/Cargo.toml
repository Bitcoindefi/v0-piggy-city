[package]
name = "piggy-nft"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=26.1.1"
stellar-tokens = "=0.7.2"

[dev-dependencies]
soroban-sdk = { version = "=26.1.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
strip = true
panic = "abort"
codegen-units = 1